name: Test and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make vet test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and checksum binaries
        shell: bash
        run: |
          make dist .SHELLFLAGS=-ec
          for target in linux-amd64 linux-arm64 linux-armv7 darwin-amd64 darwin-arm64 windows-amd64; do
            ext=""
            [[ "$target" == windows-* ]] && ext=".exe"
            for binary in bedrockproxy bedping lanprobe landial; do
              test -s "dist/${binary}-${target}${ext}"
            done
          done
          (cd dist && sha256sum bedrockproxy-* bedping-* lanprobe-* landial-* > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: bedrockproxy-${{ github.sha }}
          path: dist/
          if-no-files-found: error
